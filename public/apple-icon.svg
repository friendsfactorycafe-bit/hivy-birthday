  <!-- Heart Shape -->
  <path d="M90 144 C36 99 36 54 63 45 C81 39.6 90 57.6 90 57.6 C90 57.6 99 39.6 117 45 C144 54 144 99 90 144 Z" fill="url(#heartGradApple)"/>
  <!-- Sparkle accents -->
  <circle cx="50" cy="50" r="5" fill="white" opacity="0.8"/>
  <circle cx="130" cy="50" r="4" fill="white" opacity="0.6"/>
  <circle cx="135" cy="81" r="4" fill="white" opacity="0.5"/>
  <circle cx="45" cy="81" r="4" fill="white" opacity="0.5"/>
