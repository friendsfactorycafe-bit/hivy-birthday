      <stop offset="0%" style="stop-color:#BE123C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB7185;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGradApple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FECDD3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
