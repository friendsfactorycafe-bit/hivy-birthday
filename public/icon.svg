<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BE123C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB7185;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FECDD3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#roseGrad)"/>
  <!-- Heart Shape -->
  <path d="M50 80 C20 55 20 30 35 25 C45 22 50 32 50 32 C50 32 55 22 65 25 C80 30 80 55 50 80 Z" fill="url(#heartGrad)"/>
  <!-- Sparkle accents -->
  <circle cx="28" cy="28" r="3" fill="white" opacity="0.8"/>
  <circle cx="72" cy="28" r="2" fill="white" opacity="0.6"/>
  <circle cx="75" cy="45" r="2" fill="white" opacity="0.5"/>
  <circle cx="25" cy="45" r="2" fill="white" opacity="0.5"/>
  <!-- Small heart glow -->
  <ellipse cx="42" cy="38" rx="4" ry="3" fill="white" opacity="0.4"/>
</svg>
